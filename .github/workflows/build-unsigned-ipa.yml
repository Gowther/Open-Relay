name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Clone local MarkdownView dependency
        run: |
          git clone --depth 1 https://github.com/Ichigo3766/MarkdownView.git ../MarkdownView

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "Open UI.xcodeproj" \
            -scheme "Open UI"

      - name: Build app without code signing
        run: |
          xcodebuild build \
            -project "Open UI.xcodeproj" \
            -scheme "Open UI" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          PRODUCTS_DIR="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos"
          APP_PATH="$(find "$PRODUCTS_DIR" -maxdepth 1 -type d -name "*.app" | head -n 1)"

          if [ -z "$APP_PATH" ]; then
            echo "No .app found in $PRODUCTS_DIR"
            exit 1
          fi

          rm -rf "$RUNNER_TEMP/ipa"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"

          find "$RUNNER_TEMP/ipa/Payload" -maxdepth 2 -type d -name "PlugIns" -prune -exec rm -rf {} +
          find "$RUNNER_TEMP/ipa/Payload" -name "_CodeSignature" -type d -prune -exec rm -rf {} +
          find "$RUNNER_TEMP/ipa/Payload" -name "embedded.mobileprovision" -delete

          (cd "$RUNNER_TEMP/ipa" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/Open-Relay-unsigned.ipa" Payload)
          ls -lh "$GITHUB_WORKSPACE/Open-Relay-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Open-Relay-unsigned-ipa
          path: Open-Relay-unsigned.ipa
          if-no-files-found: error
